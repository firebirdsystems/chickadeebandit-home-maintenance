<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Home Maintenance</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:           var(--hub-bg, #f9fafb);
      --card:         var(--hub-surface, #ffffff);
      --border:       var(--hub-border, #e5e7eb);
      --border-mid:   var(--hub-border, #d1d5db);
      --text:         var(--hub-text, #111827);
      --muted:        var(--hub-text-muted, #6b7280);
      --accent:       var(--hub-primary, #111827);
      --accent-fg:    var(--hub-primary-fg, #ffffff);
      --accent-hover: var(--hub-primary-hover, #374151);
      --accent-light: #f3f4f6;
      --radius:       var(--hub-radius, 0.5rem);
      --shadow:       0 1px 3px rgba(0,0,0,.07);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg); color: var(--text);
      min-height: 100vh; font-size: var(--hub-font-size, 15px); line-height: 1.5;
    }
    .app { max-width: 640px; margin: 0 auto; padding: 16px; }

    header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 16px; padding: 14px 18px;
      background: var(--accent); border-radius: var(--radius); color: white;
    }
    header h1 { font-size: 1.2rem; font-weight: 700; }
    header .sub { font-size: 0.8rem; opacity: .75; margin-top: 1px; }

    .btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 8px 16px; border-radius: 8px;
      font-size: 0.875rem; font-weight: 600; cursor: pointer; border: none; transition: opacity .15s;
    }
    .btn:disabled { opacity: .5; cursor: default; }
    .btn-primary  { background: var(--accent); color: white; }
    .btn-primary:hover:not(:disabled)  { opacity: .88; }
    .btn-ghost    { background: transparent; color: var(--muted); border: 1.5px solid var(--border); }
    .btn-ghost:hover { border-color: var(--text); color: var(--text); }
    .btn-danger   { background: #dc2626; color: white; }
    .btn-danger:hover:not(:disabled)   { opacity: .88; }
    .btn-icon     { background: rgba(255,255,255,.2); color: white; border: none; font-size: 1.2rem; padding: 6px 10px; border-radius: 8px; }
    .btn-icon:hover { background: rgba(255,255,255,.3); }
    .btn-sm       { padding: 5px 12px; font-size: 0.8rem; }
    .btn-link     { background: none; border: none; color: var(--accent); font-size: 0.82rem; font-weight: 600; cursor: pointer; padding: 0; text-decoration: underline; }

    .item-tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; }
    .item-tab {
      padding: 6px 14px; border-radius: 20px;
      border: 1.5px solid var(--border); background: var(--card);
      font-size: 0.88rem; font-weight: 600; cursor: pointer; transition: all .15s; color: var(--muted);
    }
    .item-tab.active { border-color: var(--accent); background: var(--accent-light); color: var(--accent); }

    /* ── Activity cards ──────────────────────────────────── */
    .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; margin-bottom: 24px; }
    .activity-card {
      background: var(--card); border: 1.5px solid var(--border);
      border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow);
      display: flex; flex-direction: column;
    }
    .card-body { padding: 14px 16px 10px; flex: 1; cursor: pointer; }
    .card-body:hover { background: #fafafa; }
    .card-top { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
    .card-icon { font-size: 1.5rem; line-height: 1; flex-shrink: 0; }
    .card-name { font-weight: 700; font-size: 1rem; flex: 1; }
    .status-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--status-color, #6b7280); flex-shrink: 0; }
    .card-label { font-size: 0.85rem; font-weight: 600; color: var(--status-color, var(--muted)); margin-bottom: 6px; }
    .card-last-by {
      display: flex; align-items: center; gap: 6px;
      margin-bottom: 2px; font-size: 0.8rem; color: var(--muted);
    }
    .card-last-by .by-avatar {
      width: 20px; height: 20px; border-radius: 50%;
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 0.62rem; font-weight: 700; color: white; flex-shrink: 0;
    }
    .card-last-by strong { color: var(--text); font-weight: 600; }
    .card-hint { font-size: 0.72rem; color: var(--muted); margin-top: 4px; opacity: .7; }
    .progress-track { height: 4px; background: var(--border); border-radius: 2px; margin: 8px 0 4px; overflow: hidden; }
    .progress-fill { height: 100%; border-radius: 2px; background: var(--status-color, var(--muted)); width: calc(var(--status-pct, 0) * 100%); transition: width .4s ease, background .4s ease; }
    .done-btn {
      width: 100%; padding: 11px; border: none;
      font-size: 0.9rem; font-weight: 700; color: white; cursor: pointer;
      background: var(--status-color, #6b7280);
      transition: opacity .15s, background .4s ease; letter-spacing: .02em;
    }
    .done-btn:active { opacity: .8; }
    .done-btn:hover  { opacity: .92; }

    /* ── Section headings ────────────────────────────────── */
    .section-title { font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: 10px; }

    /* ── Documents section ───────────────────────────────── */
    .docs-section { margin-top: 8px; }
    .doc-row {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 14px; background: var(--card);
      border: 1px solid var(--border); border-radius: 8px;
      margin-bottom: 8px; text-decoration: none; color: inherit;
    }
    .doc-row:hover { border-color: var(--accent); }
    .doc-icon { font-size: 1.2rem; flex-shrink: 0; }
    .doc-info { flex: 1; min-width: 0; }
    .doc-name { font-weight: 600; font-size: 0.88rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .doc-meta { font-size: 0.75rem; color: var(--muted); }
    .doc-actions { display: flex; gap: 6px; flex-shrink: 0; }
    .upload-area {
      border: 2px dashed var(--border); border-radius: 8px;
      padding: 18px; text-align: center; color: var(--muted);
      font-size: 0.88rem; cursor: pointer; transition: all .15s;
    }
    .upload-area:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-light); }
    .upload-area.dragover { border-color: var(--accent); background: var(--accent-light); }

    /* ── Modal ───────────────────────────────────────────── */
    .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: flex; align-items: flex-end; justify-content: center; z-index: 100; }
    @media (min-width: 480px) { .modal-backdrop { align-items: center; padding: 20px; } }
    .modal { background: white; border-radius: var(--radius) var(--radius) 0 0; width: 100%; max-width: 520px; padding: 22px; max-height: 92vh; overflow-y: auto; }
    @media (min-width: 480px) { .modal { border-radius: var(--radius); } }
    .modal h3 { font-size: 1.1rem; font-weight: 700; margin-bottom: 16px; }

    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 0.78rem; font-weight: 700; color: var(--muted); margin-bottom: 5px; text-transform: uppercase; letter-spacing: .04em; }
    .form-group input[type="text"], .form-group input[type="number"], .form-group select, .form-group textarea {
      width: 100%; border: 1.5px solid var(--border); border-radius: 8px; padding: 9px 12px;
      font-size: 0.95rem; outline: none; transition: border-color .15s; background: white; font-family: inherit;
    }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: var(--accent); }
    .form-group textarea { resize: vertical; min-height: 64px; }
    .form-group .row { display: flex; gap: 10px; }
    .form-group .row > * { flex: 1; }
    .muted-label { font-weight: 400; text-transform: none; color: var(--muted); }

    .emoji-grid { display: flex; flex-wrap: wrap; gap: 6px; }
    .emoji-btn { width: 38px; height: 38px; border-radius: 8px; border: 1.5px solid var(--border); background: var(--bg); font-size: 1.2rem; cursor: pointer; transition: all .12s; display: flex; align-items: center; justify-content: center; }
    .emoji-btn:hover { border-color: var(--accent); background: var(--accent-light); }
    .emoji-btn.selected { border-color: var(--accent); background: var(--accent-light); box-shadow: 0 0 0 2px var(--accent); }

    .modal-actions { display: flex; gap: 8px; margin-top: 18px; flex-wrap: wrap; }
    .modal-actions .btn { flex: 1; justify-content: center; min-width: 90px; }

    /* ── Log entry modal ─────────────────────────────────── */
    .log-entry-form { border-top: 1px solid var(--border); padding-top: 14px; margin-top: 4px; }

    /* ── History list ────────────────────────────────────── */
    .history-list { margin-top: 10px; }
    .history-row {
      display: flex; gap: 10px; padding: 10px 0;
      border-bottom: 1px solid var(--border);
    }
    .history-row:last-child { border-bottom: none; }
    .history-avatar { width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.75rem; font-weight: 700; color: white; flex-shrink: 0; margin-top: 2px; }
    .history-body { flex: 1; }
    .history-who { font-weight: 600; font-size: 0.88rem; }
    .history-when { font-size: 0.78rem; color: var(--muted); }
    .history-notes { font-size: 0.85rem; color: var(--text); margin-top: 3px; font-style: italic; }

    /* ── Settings ────────────────────────────────────────── */
    .settings-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
    .settings-header h3 { font-size: 1.1rem; font-weight: 700; }
    .tabs { display: flex; gap: 4px; background: var(--border); border-radius: 10px; padding: 3px; margin-bottom: 14px; }
    .tab { flex: 1; padding: 7px; border-radius: 8px; border: none; cursor: pointer; font-size: 0.85rem; font-weight: 600; color: var(--muted); background: transparent; transition: all .15s; }
    .tab.active { background: white; color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.1); }
    .settings-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--border); }
    .settings-row:last-child { border-bottom: none; }
    .settings-row .info { flex: 1; font-size: 0.88rem; }
    .settings-row .sched-meta { font-size: 0.78rem; color: var(--muted); }
    .act-list { margin: 4px 0 6px 10px; padding-left: 10px; border-left: 2px solid var(--border); }
    .act-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 5px 0; border-bottom: 1px solid var(--border); }
    .act-row:last-child { border-bottom: none; }
    .act-row .info { flex: 1; font-size: 0.83rem; }

    .empty { text-align: center; padding: 36px 16px; color: var(--muted); font-size: 0.9rem; }
    .empty-sm { font-size: 0.85rem; color: var(--muted); padding: 8px 0; }
    .loading { text-align: center; padding: 40px; color: var(--muted); }
    .muted { color: var(--muted); }

    .uploading-indicator { font-size: 0.82rem; color: var(--accent); padding: 8px 0; }
  </style>
  <base href="/run/home-maintenance/" />
</head>
<body>
<div class="app">
  <div id="root"><div class="loading">Loading…</div></div>
</div>
<script type="module">
import { memberColor, initial, esc, isAdult, hubConfirm, createFilesHelper } from "/hub-sdk.js";
import {
  formatDays, intervalUnit,
  fmtDate, fmtDateTime,
  statusColor, formatBytes, docIcon,
  activityStatusFromLog,
} from "./logic.js";

const CONTEXT = window.__CONTEXT_URL ?? "";
const DB      = window.__DB_URL      ?? "";
const DOCS    = window.__DOCS_URL    ?? "";
const ME      = window.__CURRENT_MEMBER ?? null;
const files   = createFilesHelper(window.__FILES_URL ?? "");

let members      = [];
let items        = [];    // things being maintained (car, HVAC, etc.)
let activities   = [];    // all tasks across all items
let lastLogs     = {};    // activityId → most recent log
let documents    = [];    // documents for selected item
let selectedId   = null;
let actFormItemId = null; // item context for the open activity form
let refreshTimer  = null;

async function db(sql, params = []) {
  if (!DB) return { rows: [] };
  const res = await fetch(DB, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ sql, params }) });
  return res.json();
}

async function initDb() {
  // Schema is managed by hub migrations (migrations/001_init.sql)
}

async function loadMembers() {
  if (!CONTEXT) { members = [{ id: "demo-1", name: "Alex", role: "adult" }, { id: "demo-2", name: "Jordan", role: "adult" }]; return; }
  try { const res = await fetch(`${CONTEXT}?keys=family.members`); members = ((await res.json())["family.members"]) ?? []; } catch { members = []; }
}
async function loadItems()  { const { rows } = await db(`SELECT * FROM items ORDER BY created_at`); items = rows ?? []; }
async function loadActivities() {
  const { rows } = await db(`SELECT * FROM activities ORDER BY item_id, sort_order, created_at`);
  activities = rows ?? [];
}
async function loadLastLogs() {
  lastLogs = {};
  const curActs = activities.filter(a => a.item_id === selectedId);
  if (!curActs.length) return;
  const ids = curActs.map(a => a.id);
  const ph  = ids.map(() => "?").join(",");
  const { rows } = await db(`SELECT l.* FROM logs l INNER JOIN (SELECT activity_id, MAX(done_at) AS mx FROM logs WHERE activity_id IN (${ph}) GROUP BY activity_id) m ON l.activity_id = m.activity_id AND l.done_at = m.mx`, ids);
  for (const r of rows ?? []) lastLogs[r.activity_id] = r;
}
async function loadDocuments() {
  if (!selectedId || !DOCS) { documents = []; return; }
  const res = await fetch(`${DOCS}?sourceId=${encodeURIComponent(selectedId)}`);
  documents = res.ok ? await res.json() : [];
}

// ─── Status ───────────────────────────────────────────────────────────────
function activityStatus(activity) {
  return activityStatusFromLog(activity, lastLogs[activity.id], members);
}

// ─── Log with notes ───────────────────────────────────────────────────────
async function markDone(activityId) {
  if (!ME) return;
  const activity = activities.find(a => a.id === activityId);
  if (!activity) return;
  openLogEntryModal(activity);
}

async function saveLog(activityId, notes) {
  const id  = crypto.randomUUID();
  const now = new Date().toISOString();
  // Keep full history — no pruning
  await db(`INSERT INTO logs (id, activity_id, item_id, done_by, done_at, notes, created_at) VALUES (?, ?, ?, ?, ?, ?, ?)`,
    [id, activityId, selectedId, ME.id, now, notes, now]);
  lastLogs[activityId] = { id, activity_id: activityId, item_id: selectedId, done_by: ME.id, done_at: now, notes };
  closeModal();
  renderMain();
}

function openLogEntryModal(activity) {
  openModal(`
    <h3>✓ Mark as Done</h3>
    <div style="margin-bottom:14px">
      <strong>${activity.icon} ${esc(activity.name)}</strong>
      <div style="font-size:.82rem;color:var(--muted);margin-top:2px">${esc(items.find(i => i.id === selectedId)?.name ?? "")}</div>
    </div>
    <div class="form-group">
      <label>Notes <span class="muted-label">(optional)</span></label>
      <textarea id="log-notes" rows="3" placeholder="Brand used, cost, what was replaced, any observations…" autofocus></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="submitLog('${activity.id}')">Save Log Entry</button>
    </div>`);
}

window.submitLog = async activityId => {
  const notes = document.getElementById("log-notes").value.trim();
  const btn = modalEl?.querySelector('.modal-actions .btn-primary');
  if (btn) { btn.disabled = true; btn.textContent = 'Saving…'; }
  await saveLog(activityId, notes);
};

// ─── History modal ────────────────────────────────────────────────────────
async function openHistoryModal(activityId) {
  const activity = activities.find(a => a.id === activityId);
  if (!activity) return;
  const { rows } = await db(`SELECT * FROM logs WHERE activity_id = ? ORDER BY done_at DESC LIMIT 50`, [activityId]);
  const logs = rows ?? [];

  const historyHtml = logs.length === 0
    ? `<div class="empty-sm">No history yet — tap Done to log the first entry.</div>`
    : logs.map(l => {
        const m   = members.find(x => x.id === l.done_by);
        const col = memberColor(m?.id ?? "", members);
        return `
          <div class="history-row">
            <div class="history-avatar" style="background:${col}">${initial(m?.name ?? "?")}</div>
            <div class="history-body">
              <div class="history-who">${esc(m?.name ?? "Someone")}</div>
              <div class="history-when">${fmtDateTime(l.done_at)}</div>
              ${l.notes ? `<div class="history-notes">"${esc(l.notes)}"</div>` : ""}
            </div>
            ${isAdult(ME) ? `<button class="btn btn-ghost btn-sm" onclick="deleteLog('${l.id}','${activityId}')" style="align-self:flex-start">✕</button>` : ""}
          </div>`;
      }).join("");

  openModal(`
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">
      <h3 style="margin-bottom:0">${activity.icon} ${esc(activity.name)} History</h3>
      <button class="btn btn-ghost btn-sm" onclick="closeModal()">Close</button>
    </div>
    <div class="history-list">${historyHtml}</div>`);
}

window.deleteLog = async (logId, activityId) => {
  if (!await hubConfirm({ message: "Delete this log entry?", confirmLabel: "Delete", destructive: true })) return;
  await db(`DELETE FROM logs WHERE id = ?`, [logId]);
  // Refresh last log cache for this activity
  const { rows } = await db(`SELECT * FROM logs WHERE activity_id = ? ORDER BY done_at DESC LIMIT 1`, [activityId]);
  if (rows?.length) lastLogs[activityId] = rows[0];
  else delete lastLogs[activityId];
  await openHistoryModal(activityId);
  renderMain();
};

// ─── Documents ────────────────────────────────────────────────────────────

async function uploadDocument(file) {
  if (!DOCS || !ME) return;
  const area = document.getElementById("upload-area");
  if (area) { area.textContent = "⏳ Uploading…"; area.classList.add("uploading"); }

  try {
    const data = await files.upload(file);
    const res  = await fetch(DOCS, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        title: file.name, category: "home",
        fileKey: data.id, mimeType: file.type, sizeBytes: file.size,
        sourceId: selectedId,
      }),
    });
    const { id: docId } = await res.json();
    documents = [{ id: docId, title: file.name, fileKey: data.id, mimeType: file.type, sizeBytes: file.size, sourceId: selectedId, createdAt: new Date().toISOString() }, ...documents];
    renderMain();
  } catch (err) {
    alert("Upload failed: " + err.message);
    renderMain();
  }
}

async function deleteDocument(docId, fileKey) {
  if (!await hubConfirm({ message: "Delete this document?", confirmLabel: "Delete", destructive: true })) return;
  await fetch(`${DOCS}/${docId}`, { method: "DELETE" });
  if (fileKey) await files.delete(fileKey).catch(() => {});
  documents = documents.filter(d => d.id !== docId);
  renderMain();
}

// ─── Item CRUD ────────────────────────────────────────────────────────────
async function saveItem(fields, id = null) {
  const now = new Date().toISOString();
  if (id) {
    await db(`UPDATE items SET name = ?, emoji = ?, location = ?, notes = ? WHERE id = ?`, [fields.name, fields.emoji, fields.location, fields.notes, id]);
    items = items.map(i => i.id === id ? { ...i, ...fields } : i);
  } else {
    const newId = crypto.randomUUID();
    await db(`INSERT INTO items (id, name, emoji, location, notes, created_at) VALUES (?, ?, ?, ?, ?, ?)`, [newId, fields.name, fields.emoji, fields.location, fields.notes, now]);
    items = [...items, { id: newId, ...fields, created_at: now }];
    if (!selectedId) selectedId = newId;
    // Seed defaults based on emoji/name heuristics
    const name = fields.name.toLowerCase();
    const defaults = [];
    if (name.includes("car") || name.includes("truck") || name.includes("vehicle") || name.includes("auto")) {
      defaults.push({ name: "Oil Change", icon: "🛢️", days: 90 });
      defaults.push({ name: "Tire Rotation", icon: "🔄", days: 180 });
    } else if (name.includes("hvac") || name.includes("furnace") || name.includes("ac") || name.includes("air")) {
      defaults.push({ name: "Filter Change", icon: "🌀", days: 90 });
      defaults.push({ name: "Annual Service", icon: "🔧", days: 365 });
    } else {
      defaults.push({ name: "Inspection", icon: "🔍", days: 180 });
      defaults.push({ name: "Service", icon: "🔧", days: 365 });
    }
    for (let i = 0; i < defaults.length; i++) {
      const aId = crypto.randomUUID();
      await db(`INSERT INTO activities (id, item_id, name, icon, interval_days, sort_order, created_at) VALUES (?, ?, ?, ?, ?, ?, ?)`,
        [aId, newId, defaults[i].name, defaults[i].icon, defaults[i].days, i, now]);
      activities = [...activities, { id: aId, item_id: newId, name: defaults[i].name, icon: defaults[i].icon, interval_days: defaults[i].days, sort_order: i, created_at: now }];
    }
  }
}

async function deleteItem(id) {
  if (!await hubConfirm({ message: "Delete this item?", description: "All maintenance records will be permanently removed.", confirmLabel: "Delete item", destructive: true })) return false;
  await db(`DELETE FROM items WHERE id = ?`, [id]);
  await db(`DELETE FROM activities WHERE item_id = ?`, [id]);
  await db(`DELETE FROM logs WHERE item_id = ?`, [id]);
  // Remove hub documents linked to this item (hub cascade deletes on app uninstall,
  // but we clean up eagerly here too)
  if (DOCS) {
    const res = await fetch(`${DOCS}?sourceId=${encodeURIComponent(id)}`);
    const docsToDelete = res.ok ? await res.json() : [];
    for (const d of docsToDelete) {
      await fetch(`${DOCS}/${d.id}`, { method: "DELETE" });
      if (d.fileKey) await files.delete(d.fileKey).catch(() => {});
    }
  }
  items = items.filter(i => i.id !== id);
  activities = activities.filter(a => a.item_id !== id);
  if (selectedId === id) { selectedId = items[0]?.id ?? null; lastLogs = {}; documents = []; if (selectedId) { await loadLastLogs(); await loadDocuments(); } }
  return true;
}

async function saveActivity(fields, id = null) {
  const now = new Date().toISOString();
  const itemId = actFormItemId ?? selectedId;
  if (id) {
    await db(`UPDATE activities SET name = ?, icon = ?, interval_days = ? WHERE id = ?`, [fields.name, fields.icon, fields.interval_days, id]);
    activities = activities.map(a => a.id === id ? { ...a, ...fields } : a);
  } else {
    const newId = crypto.randomUUID();
    const sortOrder = activities.filter(a => a.item_id === itemId).length;
    await db(`INSERT INTO activities (id, item_id, name, icon, interval_days, sort_order, created_at) VALUES (?, ?, ?, ?, ?, ?, ?)`,
      [newId, itemId, fields.name, fields.icon, fields.interval_days, sortOrder, now]);
    activities = [...activities, { id: newId, item_id: itemId, ...fields }];
    if (fields.lastDoneAt) {
      const logId = crypto.randomUUID();
      await db(`INSERT INTO logs (id, activity_id, item_id, done_by, done_at, notes, created_at) VALUES (?, ?, ?, ?, ?, ?, ?)`,
        [logId, newId, itemId, ME.id, fields.lastDoneAt, "", now]);
      lastLogs[newId] = { id: logId, activity_id: newId, item_id: itemId, done_by: ME.id, done_at: fields.lastDoneAt, notes: "" };
    }
  }
}

async function deleteActivity(id) {
  if (!await hubConfirm({ message: "Delete this activity?", description: "The activity and its log history will be permanently removed.", confirmLabel: "Delete", destructive: true })) return false;
  await db(`DELETE FROM activities WHERE id = ?`, [id]);
  await db(`DELETE FROM logs WHERE activity_id = ?`, [id]);
  activities = activities.filter(a => a.id !== id);
  delete lastLogs[id];
  return true;
}

// ─── Modal ────────────────────────────────────────────────────────────────
let modalEl = null;
function openModal(html) {
  closeModal();
  modalEl = document.createElement("div");
  modalEl.className = "modal-backdrop";
  modalEl.innerHTML = `<div class="modal">${html}</div>`;
  modalEl.addEventListener("click", e => { if (e.target === modalEl) closeModal(); });
  document.body.appendChild(modalEl);
}
function closeModal() { modalEl?.remove(); modalEl = null; }

// ─── Render ───────────────────────────────────────────────────────────────
function renderCard(activity) {
  const { pct, label, lastBy } = activityStatus(activity);
  const color = statusColor(pct);
  const pctC  = Math.min(1, pct);
  let lastByHtml = "";
  if (lastBy) {
    const name = lastBy.member?.name ?? "Someone";
    const col  = memberColor(lastBy.member?.id ?? "", members);
    lastByHtml = `<div class="card-last-by"><span class="by-avatar" style="background:${col}">${initial(name)}</span><span><strong>${esc(name)}</strong> · ${lastBy.date}</span></div>`;
  } else {
    lastByHtml = `<div class="card-last-by" style="font-style:italic;color:var(--muted)">Never done</div>`;
  }
  return `
    <div class="activity-card" style="--status-color:${color};--status-pct:${pctC.toFixed(3)}">
      <div class="card-body" onclick="openHistory('${activity.id}')">
        <div class="card-top"><span class="card-icon">${activity.icon}</span><span class="card-name">${esc(activity.name)}</span><span class="status-dot"></span></div>
        <div class="card-label">${label}</div>
        ${lastByHtml}
        <div class="progress-track"><div class="progress-fill"></div></div>
        <div class="card-hint">Tap to view history</div>
      </div>
      <button class="done-btn" onclick="markDone('${activity.id}')">✓ Log Done</button>
    </div>`;
}

function renderDocsSection() {
  const meIsAdmin = isAdult(ME);
  const docsHtml = documents.map(d => `
    <a class="doc-row" href="${esc(files.url(d.fileKey))}" target="_blank" rel="noopener" onclick="event.stopPropagation()">
      <span class="doc-icon">${docIcon(d.title)}</span>
      <div class="doc-info">
        <div class="doc-name">${esc(d.title)}</div>
        <div class="doc-meta">${formatBytes(d.sizeBytes ?? 0)} · ${fmtDate(d.createdAt)}</div>
      </div>
      ${meIsAdmin ? `<div class="doc-actions"><button class="btn btn-ghost btn-sm" onclick="event.preventDefault();doDelDoc('${d.id}','${esc(d.fileKey ?? '')}')">✕</button></div>` : ""}
    </a>`).join("");

  const uploadHtml = meIsAdmin && window.__FILES_URL ? `
    <div class="upload-area" id="upload-area" onclick="triggerUpload()" ondragover="event.preventDefault();this.classList.add('dragover')" ondragleave="this.classList.remove('dragover')" ondrop="handleDrop(event)">
      📎 Click or drag &amp; drop to upload a document (PDF, image, or any file)
    </div>
    <input type="file" id="file-input" style="display:none" onchange="handleFileSelect(this)" />` : "";

  return `
    <div class="docs-section">
      <div class="section-title">Documents</div>
      ${documents.length === 0 ? `<div class="empty-sm" style="margin-bottom:10px">No documents yet${meIsAdmin ? " — upload warranty PDFs, manuals, receipts" : ""}.</div>` : docsHtml}
      ${uploadHtml}
    </div>`;
}

function renderMain() {
  const item      = items.find(i => i.id === selectedId);
  const meIsAdmin = isAdult(ME);
  const curActs   = activities.filter(a => a.item_id === selectedId);
  const tabsHtml  = items.length > 1
    ? `<div class="item-tabs">${items.map(i => `<button class="item-tab ${i.id === selectedId ? "active" : ""}" onclick="selectItem('${i.id}')">${i.emoji} ${esc(i.name)}</button>`).join("")}</div>` : "";

  let body = "";
  if (items.length === 0) {
    body = meIsAdmin ? `<div class="empty">No items yet. Tap ⚙️ to add your first item (car, HVAC, appliance…).</div>` : `<div class="empty">No maintenance items configured yet.</div>`;
  } else {
    const cardGrid = curActs.length === 0
      ? (meIsAdmin ? `<div class="empty" style="padding:20px">No tasks for ${esc(item?.name ?? "this item")}. Tap ⚙️ to add some.</div>` : `<div class="empty" style="padding:20px">No tasks configured yet.</div>`)
      : `<div class="card-grid">${curActs.map(renderCard).join("")}</div>`;
    body = `${cardGrid}${renderDocsSection()}`;
  }

  document.getElementById("root").innerHTML = `
    <header>
      <div><h1>${item ? `${item.emoji} ${esc(item.name)}` : "🔧 Home Maintenance"}</h1><div class="sub">${item?.location ? esc(item.location) : "Maintenance tracker"}</div></div>
      ${meIsAdmin ? `<button class="btn btn-icon" onclick="openSettings()" title="Settings">⚙️</button>` : ""}
    </header>
    ${tabsHtml}${body}`;
}

// ─── Settings ─────────────────────────────────────────────────────────────
const INTERVAL_UNIT = intervalUnit;

function renderSettingsModal() {
  const itemsHtml = items.map(i => {
    const iActs = activities.filter(a => a.item_id === i.id);
    const actsHtml = iActs.map(a => `
      <div class="act-row">
        <div class="info"><strong>${a.icon} ${esc(a.name)}</strong> <span class="sched-meta">Every ${INTERVAL_UNIT(a.interval_days)}</span></div>
        <div style="display:flex;gap:4px;flex-shrink:0">
          <button class="btn btn-ghost btn-sm" onclick="openActForm('${a.id}')">Edit</button>
          <button class="btn btn-danger btn-sm" onclick="doDelAct('${a.id}')">Delete</button>
        </div>
      </div>`).join("");
    return `
      <div class="settings-row" style="flex-direction:column;align-items:stretch;gap:0">
        <div style="display:flex;align-items:center;justify-content:space-between;gap:8px">
          <div class="info"><strong>${i.emoji} ${esc(i.name)}</strong>${i.location ? ` <span class="muted">· ${esc(i.location)}</span>` : ""}</div>
          <div style="display:flex;gap:6px;flex-shrink:0">
            <button class="btn btn-ghost btn-sm" onclick="openItemForm('${i.id}')">Edit</button>
            <button class="btn btn-danger btn-sm" onclick="doDelItem('${i.id}')">Delete</button>
          </div>
        </div>
        <div class="act-list">
          ${actsHtml || `<div class="empty-sm">No tasks yet.</div>`}
          <button class="btn btn-ghost btn-sm" style="margin-top:6px" onclick="openActForm(null,'${i.id}')">+ Add Task</button>
        </div>
      </div>`;
  }).join("") || `<div class="empty-sm">No items yet.</div>`;
  openModal(`
    <div class="settings-header"><h3>⚙️ Items &amp; Tasks</h3><button class="btn btn-ghost btn-sm" onclick="closeModal()">Done</button></div>
    ${itemsHtml}
    <div style="margin-top:14px"><button class="btn btn-primary btn-sm" onclick="openItemForm()">+ Add Item</button></div>`);
}

window.doDelItem    = async id => { if (await deleteItem(id)) { renderSettingsModal(); renderMain(); } };
window.doDelAct     = async id => { if (await deleteActivity(id)) { renderSettingsModal(); renderMain(); } };
window.openSettings = () => renderSettingsModal();

// ─── Item form ────────────────────────────────────────────────────────────
const ITEM_EMOJIS = ["🚗","🚙","🚕","🚐","🛻","🏠","🏡","❄️","🌡️","💧","⚡","🔥","🌀","🧰","🛠️","🔧"];
function openItemForm(id = null) {
  const item = id ? items.find(x => x.id === id) : null;
  const sel  = item?.emoji ?? "🔧";
  const eg   = ITEM_EMOJIS.map(e => `<button type="button" class="emoji-btn ${sel === e ? "selected" : ""}" onclick="pickItemEmoji(this,'${e}')">${e}</button>`).join("");
  openModal(`
    <h3 style="margin-bottom:16px">${item ? "Edit Item" : "Add Item"}</h3>
    <input type="hidden" id="if-emoji" value="${sel}" />
    <div class="form-group"><label>Icon</label><div class="emoji-grid">${eg}</div></div>
    <div class="form-group"><label>Name</label><input id="if-name" type="text" value="${esc(item?.name ?? "")}" placeholder="Honda Civic 2019, Downstairs HVAC…" autofocus /></div>
    <div class="form-group"><label>Location <span class="muted-label">(optional)</span></label><input id="if-loc" type="text" value="${esc(item?.location ?? "")}" placeholder="Garage, Basement…" /></div>
    <div class="form-group"><label>Notes <span class="muted-label">(optional)</span></label><textarea id="if-notes" rows="2" placeholder="VIN, model number, warranty expiry…">${esc(item?.notes ?? "")}</textarea></div>
    <div class="modal-actions"><button class="btn btn-ghost" onclick="backToSettings()">Back</button><button class="btn btn-primary" onclick="submitItem('${id ?? ""}')">${item ? "Save" : "Add Item"}</button></div>`);
}
window.pickItemEmoji = (btn, e) => { document.getElementById("if-emoji").value = e; btn.closest(".emoji-grid").querySelectorAll(".emoji-btn").forEach(b => b.classList.remove("selected")); btn.classList.add("selected"); };
window.submitItem = async id => {
  const name = document.getElementById("if-name").value.trim();
  if (!name) { document.getElementById("if-name").focus(); return; }
  const btn = modalEl?.querySelector('.modal-actions .btn-primary');
  if (btn) { btn.disabled = true; btn.textContent = 'Saving…'; }
  await saveItem({ name, emoji: document.getElementById("if-emoji").value, location: document.getElementById("if-loc").value.trim(), notes: document.getElementById("if-notes").value.trim() }, id || null);
  renderSettingsModal(); renderMain();
};

// ─── Activity form ────────────────────────────────────────────────────────
const ACT_ICONS = ["🔧","🛢️","🔄","🌀","🔍","💧","🪛","🔩","🧹","🪣","⚙️","🔌","💡","🪠","🔑","🛞"];
const INTERVAL_PRESETS = [{ label: "Monthly (30d)", days: 30 }, { label: "3 Months (90d)", days: 90 }, { label: "6 Months (180d)", days: 180 }, { label: "Annually (365d)", days: 365 }, { label: "Custom", days: null }];

function openActForm(id = null, itemId = null) {
  actFormItemId = id ? (activities.find(x => x.id === id)?.item_id ?? selectedId) : (itemId ?? selectedId);
  const a   = id ? activities.find(x => x.id === id) : null;
  const sel = a?.icon ?? "🔧";
  const ig  = ACT_ICONS.map(e => `<button type="button" class="emoji-btn ${sel === e ? "selected" : ""}" onclick="pickActIcon(this,'${e}')">${e}</button>`).join("");
  const presetOpts = INTERVAL_PRESETS.map(p => {
    const selected = p.days && a?.interval_days === p.days ? "selected" : (!p.days && a && !INTERVAL_PRESETS.some(x => x.days === a.interval_days)) ? "selected" : (!a && p.days === 90) ? "selected" : "";
    return `<option value="${p.days ?? "custom"}" ${selected}>${p.label}</option>`;
  }).join("");
  openModal(`
    <h3 style="margin-bottom:16px">${a ? "Edit Task" : "Add Task"}</h3>
    <input type="hidden" id="af-icon" value="${sel}" />
    <div class="form-group"><label>Icon</label><div class="emoji-grid">${ig}</div></div>
    <div class="form-group"><label>Task name</label><input id="af-name" type="text" value="${esc(a?.name ?? "")}" placeholder="Oil Change, Filter Replacement…" autofocus /></div>
    <div class="form-group"><label>Interval</label><select id="af-preset" onchange="toggleCustomDays(this)">${presetOpts}</select></div>
    <div id="custom-days-row" style="${(a && !INTERVAL_PRESETS.some(p => p.days === a.interval_days)) ? "" : "display:none"}">
      <div class="form-group"><label>Custom interval (days)</label><input id="af-days" type="number" min="1" max="3650" step="1" value="${a?.interval_days ?? 90}" style="max-width:140px" /></div>
    </div>
    ${!a ? `<div class="form-group"><label>Last done <span class="muted-label">(optional)</span></label><input id="af-lastdone" type="date" style="max-width:180px" max="${new Date().toISOString().slice(0,10)}" /></div>` : ""}
    <div class="modal-actions"><button class="btn btn-ghost" onclick="backToSettings()">Back</button><button class="btn btn-primary" onclick="submitAct('${id ?? ""}')">${a ? "Save" : "Add Task"}</button></div>`);
}
window.pickActIcon = (btn, e) => { document.getElementById("af-icon").value = e; btn.closest(".emoji-grid").querySelectorAll(".emoji-btn").forEach(b => b.classList.remove("selected")); btn.classList.add("selected"); };
window.toggleCustomDays = sel => { document.getElementById("custom-days-row").style.display = sel.value === "custom" ? "" : "none"; };
window.submitAct = async id => {
  const name   = document.getElementById("af-name").value.trim();
  const preset = document.getElementById("af-preset").value;
  const days   = preset === "custom" ? parseInt(document.getElementById("af-days").value) || 90 : parseInt(preset);
  if (!name) { document.getElementById("af-name").focus(); return; }
  const btn = modalEl?.querySelector('.modal-actions .btn-primary');
  if (btn) { btn.disabled = true; btn.textContent = 'Saving…'; }
  const lastDoneVal = document.getElementById("af-lastdone")?.value;
  const lastDoneAt  = lastDoneVal ? new Date(lastDoneVal).toISOString() : null;
  await saveActivity({ name, icon: document.getElementById("af-icon").value, interval_days: days, lastDoneAt }, id || null);
  await loadLastLogs(); renderSettingsModal(); renderMain();
};

// ─── Document upload ──────────────────────────────────────────────────────
window.triggerUpload = () => document.getElementById("file-input")?.click();
window.handleFileSelect = input => { const f = input.files[0]; if (f) uploadDocument(f); input.value = ""; };
window.handleDrop = e => {
  e.preventDefault();
  document.getElementById("upload-area")?.classList.remove("dragover");
  const f = e.dataTransfer.files[0];
  if (f) uploadDocument(f);
};
window.doDelDoc = deleteDocument;

window.backToSettings = renderSettingsModal;
window.openItemForm   = openItemForm;
window.openActForm    = openActForm;
window.closeModal     = closeModal;
window.markDone       = markDone;
window.openHistory    = openHistoryModal;
window.selectItem     = async id => { selectedId = id; await loadLastLogs(); await loadDocuments(); renderMain(); };

(async () => {
  await loadMembers();
  if (DB) {
    await initDb();
    await Promise.all([loadItems(), loadActivities()]);
    if (items.length > 0) selectedId = items[0].id;
    await Promise.all([loadLastLogs(), loadDocuments()]);
  }
  renderMain();
  refreshTimer = setInterval(() => { if (!modalEl) renderMain(); }, 60_000);
})();
</script>
</body>
</html>
